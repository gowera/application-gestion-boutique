<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestion Stock — Démarrage</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: radial-gradient(circle at 50% 30%, #123a71, #04122e 68%);
        color: #eef3ff;
      }
      main { text-align: center; }
      .mark {
        display: grid;
        width: 68px;
        height: 68px;
        margin: 0 auto 20px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 20px;
        background: rgb(255 255 255 / 8%);
        color: #ffb020;
        font-size: 30px;
        font-weight: 800;
        animation: breathe 1.8s ease-in-out infinite;
      }
      h1 { margin: 0; font-size: 21px; letter-spacing: .01em; }
      p { margin: 10px 0 22px; color: #bdcbe5; font-size: 14px; }
      .track { width: 150px; height: 3px; margin: auto; overflow: hidden; border-radius: 4px; background: #294265; }
      .progress { width: 45%; height: 100%; border-radius: inherit; background: #ffb020; animation: move 1.3s ease-in-out infinite; }
      @keyframes move { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
      @keyframes breathe { 50% { transform: scale(1.06); opacity: .78; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
        .progress { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="mark" aria-hidden="true">G</div>
      <h1>Gestion Stock</h1>
      <p>Préparation de votre espace de travail…</p>
      <div class="track" aria-hidden="true"><div class="progress"></div></div>
    </main>
  </body>
</html>
